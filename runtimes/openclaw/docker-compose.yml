services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    restart: unless-stopped
    command: node dist/index.js gateway --port 18789
    ports:
      - "127.0.0.1:18789:18789" # Control UI, loopback only
    env_file:
      - ../.env
    environment:
      # data/bin first so the appcues binary is on PATH
      - PATH=/home/node/.openclaw/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      # per-checkout OpenClaw state (gitignored)
      - ./data:/home/node/.openclaw
      # the appcues/skills checkout that sandbox.sh clones into runtimes/skills,
      # live-mounted read-only
      - ../skills/skills:/home/node/.openclaw/skills/appcues:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [NET_RAW, NET_ADMIN]
