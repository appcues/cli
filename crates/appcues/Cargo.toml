[package]
name = "appcues"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "CLI for the Appcues API"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
humantime = "2"
rmcp = { version = "3", default-features = false, features = ["server", "macros", "transport-io"] }
rpassword = "7"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.9"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
